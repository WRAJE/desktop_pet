<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';" />
    <title>绘梨衣</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bubble" class="hidden"></div>
    <div id="zzz" class="hidden">Zzz</div>
    <form id="chat" class="hidden" autocomplete="off">
      <input id="chat-input" maxlength="200" placeholder="跟绘梨衣说，回车发送" />
    </form>
    <form id="key-form" class="hidden" autocomplete="off">
      <p>粘贴 Cursor API Key，只存在本机。</p>
      <input id="key-input" type="password" maxlength="256" placeholder="sk- 或 Cursor API Key" />
      <div class="key-actions">
        <button type="button" id="key-paste">从剪贴板</button>
        <button type="submit">保存</button>
        <button type="button" id="key-cancel">取消</button>
      </div>
    </form>
    <div id="pet-menu" class="hidden">
      <button type="button" data-act="chat">打开聊天</button>
      <div class="menu-scale">
        <span>大小</span>
        <input id="scale-slider" type="range" min="0.8" max="2.4" step="0.05" />
        <span id="scale-label">1.5×</span>
      </div>
      <button type="button" data-act="top" data-check="alwaysOnTop">窗口置顶</button>
      <button type="button" data-act="sfx" data-check="sfx">音效</button>
      <button type="button" data-act="kick" data-check="kickIcons">允许轻踢图标</button>
      <button type="button" data-act="login" data-check="openAtLogin">开机自启</button>
      <button type="button" data-act="key">设置 API Key…</button>
      <button type="button" data-act="quit">退出</button>
    </div>
    <script src="game.js"></script>
  </body>
</html>
